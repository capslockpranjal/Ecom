# =========================================
# Application
# =========================================
spring.application.name=zenvy-backend

# =========================================
# Database
# =========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.open-in-view=false

# =========================================
# Mail
# =========================================
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# =========================================
# Redis
# =========================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

# =========================================
# JWT
# =========================================
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# =========================================
# Admin
# =========================================
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

# =========================================
# Images
# =========================================
app.images.storage-type=${APP_IMAGES_STORAGE_TYPE}
app.images.base-path=${APP_IMAGES_BASE_PATH}
app.images.public-base-url=${APP_IMAGES_PUBLIC_BASE_URL}
app.images.max-file-size-bytes=${APP_IMAGES_MAX_FILE_SIZE_BYTES}
app.images.s3.bucket=${APP_IMAGES_S3_BUCKET}
app.images.s3.region=${APP_IMAGES_S3_REGION}
app.images.s3.public-base-url=${APP_IMAGES_S3_PUBLIC_BASE_URL}
app.images.s3.endpoint=${APP_IMAGES_S3_ENDPOINT}

# =========================================
# Payment
# =========================================
app.payment.razorpay.key-id=${APP_PAYMENT_RAZORPAY_KEY_ID:}
app.payment.razorpay.key-secret=${APP_PAYMENT_RAZORPAY_KEY_SECRET:}
app.payment.razorpay.currency=${APP_PAYMENT_RAZORPAY_CURRENCY:INR}

# =========================================
# Cache
# =========================================
app.redis.enabled=${APP_REDIS_ENABLED}
app.cache.ttl-minutes=${APP_CACHE_TTL_MINUTES}
app.cache.key-prefix=${APP_CACHE_KEY_PREFIX}

# =========================================
# CORS
# =========================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.frontend.base-url=${APP_FRONTEND_BASE_URL}